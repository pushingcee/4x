name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/majesty-4x-game-wnmxpa
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push finish rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The game is plain ES modules and needs no build step, so the repo
      # root is the site. Keep the upload free of repo plumbing.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html styles.css manifest.webmanifest _site/
          cp -r src _site/src
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
